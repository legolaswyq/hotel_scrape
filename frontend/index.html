<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hotel Scrape — Marriott</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; }
    input { padding: 0.4rem; font-size: 1rem; }
    button { grid-column: span 2; padding: 0.6rem; font-size: 1rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #f5f5f5; }
    #error { color: #b00020; margin-top: 1rem; }
    #history { margin-top: 1.5rem; }
    #history h2 { font-size: 1rem; margin-bottom: 0.5rem; }
    #history ul { list-style: none; padding: 0; margin: 0; }
    #history li {
      padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 4px;
      margin-bottom: 0.4rem; cursor: pointer; font-size: 0.85rem;
    }
    #history li:hover { background: #f5f5f5; }
    #history .meta { color: #666; }
  </style>
</head>
<body>
  <h1>Find a Marriott Room</h1>
  <form id="search-form">
    <label>Location
      <input type="text" name="location" placeholder="New York, NY" required />
    </label>
    <label>Adults
      <input type="number" name="adults" value="1" min="1" required />
    </label>
    <label>Check-in
      <input type="date" name="check_in" required />
    </label>
    <label>Check-out
      <input type="date" name="check_out" required />
    </label>
    <label>Rooms
      <input type="number" name="rooms" value="1" min="1" required />
    </label>
    <label>Hotels to check for prepay (optional)
      <input type="number" id="prepay-limit" min="1" value="10" />
    </label>
    <button type="submit">Search</button>
  </form>
  <p style="font-size: 0.8rem; color: #666;">
    After listing hotels, that many are checked individually for a prepay
    rate (slower — resumes from where it left off on a repeat search).
  </p>

  <div id="history" hidden>
    <h2>Recent searches</h2>
    <ul></ul>
  </div>

  <div id="error" hidden></div>
  <table id="results" hidden>
    <thead>
      <tr><th>Hotel</th><th>Price / night</th><th>Total</th><th id="prepay-header" class="sortable">Prepay ▾</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <button id="check-more" type="button" hidden style="width: 100%; padding: 0.6rem; font-size: 1rem; cursor: pointer; margin-top: 1rem;"></button>

  <script>
    const form = document.getElementById("search-form");
    const errorEl = document.getElementById("error");
    const resultsEl = document.getElementById("results");
    const resultsBody = resultsEl.querySelector("tbody");
    const prepayHeader = document.getElementById("prepay-header");
    const checkMoreBtn = document.getElementById("check-more");
    const historyEl = document.getElementById("history");
    const historyList = historyEl.querySelector("ul");

    let currentHotels = [];
    let prepaySortDescending = true;
    let lastSearchData = null;

    function prepayRank(hotel) {
      // true (supports prepay) ranks first, then false, then not-yet-checked.
      if (hotel.supports_prepay === true) return 0;
      if (hotel.supports_prepay === false) return 1;
      return 2;
    }

    function renderRows(hotels) {
      resultsBody.innerHTML = "";
      for (const hotel of hotels) {
        const row = document.createElement("tr");
        const nameCell = hotel.url
          ? `<a href="${hotel.url}" target="_blank" rel="noopener">${hotel.name}</a>`
          : hotel.name;
        const prepayCell =
          hotel.supports_prepay === true ? "Yes" : hotel.supports_prepay === false ? "No" : "—";
        row.innerHTML = `
          <td>${nameCell}</td>
          <td>${hotel.price_per_night != null ? "$" + hotel.price_per_night.toFixed(2) : "-"}</td>
          <td>${hotel.total_price != null ? "$" + hotel.total_price.toFixed(2) : "-"}</td>
          <td>${prepayCell}</td>
        `;
        resultsBody.appendChild(row);
      }
    }

    prepayHeader.addEventListener("click", () => {
      prepaySortDescending = !prepaySortDescending;
      prepayHeader.textContent = prepaySortDescending ? "Prepay ▾" : "Prepay ▴";
      const sorted = [...currentHotels].sort((a, b) => {
        const diff = prepayRank(a) - prepayRank(b);
        return prepaySortDescending ? diff : -diff;
      });
      renderRows(sorted);
    });

    function updateCheckMoreButton() {
      const uncheckedCount = currentHotels.filter((h) => h.supports_prepay == null).length;
      if (uncheckedCount === 0) {
        checkMoreBtn.hidden = true;
        return;
      }
      const limitValue = Number(document.getElementById("prepay-limit").value) || 10;
      const batch = Math.min(limitValue, uncheckedCount);
      checkMoreBtn.textContent = `Check ${batch} more for prepay (${uncheckedCount} left)`;
      checkMoreBtn.hidden = false;
    }

    function fillFormFrom(entry) {
      form.elements.location.value = entry.location;
      form.elements.check_in.value = entry.check_in;
      form.elements.check_out.value = entry.check_out;
      form.elements.adults.value = entry.adults;
      form.elements.rooms.value = entry.rooms;
    }

    async function loadHistory() {
      let response, body;
      try {
        response = await fetch("/api/search-history");
        body = await response.json();
      } catch (err) {
        return;
      }
      if (!response.ok || !body.searches.length) {
        historyEl.hidden = true;
        return;
      }

      historyList.innerHTML = "";
      for (const entry of body.searches) {
        const li = document.createElement("li");
        const prepayNote = entry.prepay_checked_count > 0 ? `, ${entry.prepay_checked_count} prepay-checked` : "";
        li.innerHTML = `${entry.location} · ${entry.check_in} → ${entry.check_out} · ${entry.adults} adult(s), ${entry.rooms} room(s)
          <div class="meta">${entry.hotel_count} hotels${entry.complete ? "" : " (partial)"}${prepayNote}</div>`;
        li.addEventListener("click", () => {
          fillFormFrom(entry);
          form.requestSubmit();
        });
        historyList.appendChild(li);
      }
      historyEl.hidden = false;
    }

    async function runSearch(data, limit) {
      errorEl.hidden = true;
      const url = "/api/search" + (limit ? `?prepay_limit=${Number(limit)}` : "");

      let response, body;
      try {
        response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        body = await response.json();
      } catch (err) {
        errorEl.textContent = "Search failed — check your connection and try again.";
        errorEl.hidden = false;
        return;
      }

      if (!response.ok) {
        errorEl.textContent = body.error || "Search failed.";
        errorEl.hidden = false;
        return;
      }

      currentHotels = body.hotels;
      renderRows(
        [...currentHotels].sort((a, b) => {
          const diff = prepayRank(a) - prepayRank(b);
          return prepaySortDescending ? diff : -diff;
        })
      );
      resultsEl.hidden = false;
      updateCheckMoreButton();
      loadHistory();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      resultsBody.innerHTML = "";
      checkMoreBtn.hidden = true;

      const data = Object.fromEntries(new FormData(form).entries());
      data.adults = Number(data.adults);
      data.rooms = Number(data.rooms);
      lastSearchData = data;

      prepaySortDescending = true;
      prepayHeader.textContent = "Prepay ▾";

      const limitValue = document.getElementById("prepay-limit").value;
      await runSearch(data, limitValue ? Number(limitValue) : null);
    });

    checkMoreBtn.addEventListener("click", async () => {
      if (!lastSearchData) return;
      const limitValue = Number(document.getElementById("prepay-limit").value) || 10;
      checkMoreBtn.disabled = true;
      checkMoreBtn.textContent = "Checking…";
      await runSearch(lastSearchData, limitValue);
      checkMoreBtn.disabled = false;
    });

    loadHistory();
  </script>
</body>
</html>
